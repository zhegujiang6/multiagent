# Qdrant Configuration for Development
log_level: INFO

service:
  http_port: 6333
  grpc_port: 6334
  enable_cors: true

storage:
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/snapshots
  optimizers:
    default_segment_number: 2
  wal:
    wal_capacity_mb: 32

telemetry_disabled: true
