server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ticket-service
  datasource:
    url: ${TICKET_DATABASE_URL:jdbc:postgresql://localhost:5432/customer_service}
    username: ${TICKET_DATABASE_USERNAME:cs_admin}
    password: ${TICKET_DATABASE_PASSWORD:cs_secret_2024}
    hikari:
      maximum-pool-size: ${TICKET_DB_POOL_SIZE:20}
      minimum-idle: 2
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
      timeout: 2s
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:ticket-service-producer}
    send-message-timeout: 5000

ticket:
  idempotency:
    ttl: ${TICKET_IDEMPOTENCY_TTL:PT24H}
  events:
    rocketmq-enabled: ${ROCKETMQ_ENABLED:false}
  sla:
    scan-delay-ms: ${TICKET_SLA_SCAN_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
